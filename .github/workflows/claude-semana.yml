name: Claude Code · semana nova Zero Tampas

# Todas as sextas o Claude Code lê as métricas, escreve a semana seguinte,
# valida, gera as imagens, agenda e faz commit. Também dá para correr à mão
# qualquer comando: Actions → "Claude Code · semana nova" → Run workflow.

on:
  schedule:
    - cron: '7 9 * * 5'      # sexta ~10:07 em Lisboa
  workflow_dispatch:
    inputs:
      comando:
        description: 'Comando para o Claude (ex.: /gerar-semana, /gerar-semana 3, /analisar, /status)'
        required: false
        default: '/gerar-semana'

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: repo-escrita
  cancel-in-progress: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar gerador de imagens
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
      - name: Configurar git
        run: |
          git config user.name "zerotampas-claude"
          git config user.email "bot@users.noreply.github.com"
      - name: Métricas frescas
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node insights.js
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          CI: 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ou, com chave da API: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event.inputs.comando || '/gerar-semana' }}
          claude_args: |
            --max-turns 120
            --allowedTools "Bash(node:*),Bash(python3:*),Bash(git:*),Bash(npx:*),Bash(npm:*),Bash(ls:*),Bash(date:*),Read,Write,Edit,Glob,Grep"
      - name: Resumo no GitHub
        if: always()
        run: |
          node ferramentas/estado.js >> "$GITHUB_STEP_SUMMARY" || true
          f=$(ls -t dados/relatorios/semana-*.md 2>/dev/null | head -1); [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true
